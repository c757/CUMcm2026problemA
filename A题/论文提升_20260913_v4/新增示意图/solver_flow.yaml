meta:
  profile: academic-paper
  figureType: workflow
  theme: academic
  palette: ieee-bw
  layout: vertical
  canvas: 500x730
  font:
    primary: Times New Roman, Noto Serif CJK SC
    cjk: Noto Serif CJK SC, SimSun, Times New Roman
    formula: Latin Modern, Times New Roman
  print:
    target: cn-thesis
    widthPt: 272.1
    minPt: 9
  title: 数值求解流程
  description: 显式表现程序已有的时间推进、终止检查与继续积分；越阈时补算严格整秒后按原方式输出。
nodes:
  - id: read
    label: 读取初态与边界数据
    type: terminal
    style:
      fillColor: '#FFFFFF'
      fontColor: '#202020'
      strokeColor: '#202020'
      strokeWidth: 2
      fontSize: 18
      fontFamily: Noto Serif CJK SC
    bounds:
      x: 100
      'y': 10
      width: 300
      height: 40
  - id: grid
    label: 建立网格并初始化温湿场
    type: process
    style:
      fillColor: '#FFFFFF'
      fontColor: '#202020'
      strokeColor: '#202020'
      strokeWidth: 2
      fontSize: 18
      fontFamily: Noto Serif CJK SC
    bounds:
      x: 100
      'y': 82
      width: 300
      height: 40
  - id: props
    label: 更新局部物性参数
    type: process
    style:
      fillColor: '#FFFFFF'
      fontColor: '#202020'
      strokeColor: '#202020'
      strokeWidth: 2
      fontSize: 18
      fontFamily: Noto Serif CJK SC
    bounds:
      x: 100
      'y': 154
      width: 300
      height: 40
  - id: rhs
    label: 按共享面通量组装守恒方程
    type: process
    style:
      fillColor: '#FFFFFF'
      fontColor: '#202020'
      strokeColor: '#202020'
      strokeWidth: 2
      fontSize: 18
      fontFamily: Noto Serif CJK SC
    bounds:
      x: 100
      'y': 226
      width: 300
      height: 40
  - id: integrate
    label: 执行自适应隐式BDF积分
    type: process
    style:
      fillColor: '#FFFFFF'
      fontColor: '#202020'
      strokeColor: '#202020'
      strokeWidth: 2
      fontSize: 18
      fontFamily: Noto Serif CJK SC
    bounds:
      x: 100
      'y': 298
      width: 300
      height: 40
  - id: event
    label: |-
      达到本问
      终止条件？
    type: decision
    style:
      fillColor: '#FFFFFF'
      fontColor: '#202020'
      strokeColor: '#202020'
      strokeWidth: 2
      fontSize: 18
      fontFamily: Noto Serif CJK SC
    bounds:
      x: 100
      'y': 370
      width: 300
      height: 80
  - id: endpoint
    label: |-
      定位终止时刻
      越阈后补算严格整秒
    type: process
    style:
      fillColor: '#FFFFFF'
      fontColor: '#202020'
      strokeColor: '#202020'
      strokeWidth: 2
      fontSize: 18
      fontFamily: Noto Serif CJK SC
    bounds:
      x: 100
      'y': 482
      width: 300
      height: 56
  - id: output
    label: 径向重建、采样并输出结果
    type: terminal
    style:
      fillColor: '#FFFFFF'
      fontColor: '#202020'
      strokeColor: '#202020'
      strokeWidth: 2
      fontSize: 18
      fontFamily: Noto Serif CJK SC
    bounds:
      x: 100
      'y': 570
      width: 300
      height: 40
  - id: termination_note
    label: |-
      问题一：达到1800 s。
      问题二至四：最大含水率
      向下越过0.15 kg/kg。
    type: text
    style:
      fillColor: none
      fontColor: '#202020'
      strokeColor: none
      strokeWidth: 2
      fontSize: 17
      fontFamily: Noto Serif CJK SC
    bounds:
      x: 30
      'y': 634
      width: 440
      height: 84
edges:
  - from: read
    to: grid
    type: primary
    style:
      strokeColor: '#202020'
      strokeWidth: 2
      dashed: false
      endArrow: open
      endFill: false
      endSize: 8
      exitX: 0.5
      exitY: 1
      entryX: 0.5
      entryY: 0
      fontSize: 18
      fontColor: '#202020'
  - from: grid
    to: props
    type: primary
    style:
      strokeColor: '#202020'
      strokeWidth: 2
      dashed: false
      endArrow: open
      endFill: false
      endSize: 8
      exitX: 0.5
      exitY: 1
      entryX: 0.5
      entryY: 0
      fontSize: 18
      fontColor: '#202020'
  - from: props
    to: rhs
    type: primary
    style:
      strokeColor: '#202020'
      strokeWidth: 2
      dashed: false
      endArrow: open
      endFill: false
      endSize: 8
      exitX: 0.5
      exitY: 1
      entryX: 0.5
      entryY: 0
      fontSize: 18
      fontColor: '#202020'
  - from: rhs
    to: integrate
    type: primary
    style:
      strokeColor: '#202020'
      strokeWidth: 2
      dashed: false
      endArrow: open
      endFill: false
      endSize: 8
      exitX: 0.5
      exitY: 1
      entryX: 0.5
      entryY: 0
      fontSize: 18
      fontColor: '#202020'
  - from: integrate
    to: event
    type: primary
    style:
      strokeColor: '#202020'
      strokeWidth: 2
      dashed: false
      endArrow: open
      endFill: false
      endSize: 8
      exitX: 0.5
      exitY: 1
      entryX: 0.5
      entryY: 0
      fontSize: 18
      fontColor: '#202020'
  - from: event
    to: endpoint
    type: primary
    style:
      strokeColor: '#202020'
      strokeWidth: 2
      dashed: false
      endArrow: open
      endFill: false
      endSize: 8
      exitX: 0.5
      exitY: 1
      entryX: 0.5
      entryY: 0
      fontSize: 18
      fontColor: '#202020'
    label: 是
    labelOffset:
      x: 24
      'y': 0
  - from: endpoint
    to: output
    type: primary
    style:
      strokeColor: '#202020'
      strokeWidth: 2
      dashed: false
      endArrow: open
      endFill: false
      endSize: 8
      exitX: 0.5
      exitY: 1
      entryX: 0.5
      entryY: 0
      fontSize: 18
      fontColor: '#202020'
  - from: event
    to: props
    type: primary
    style:
      strokeColor: '#202020'
      strokeWidth: 2
      dashed: false
      endArrow: open
      endFill: false
      endSize: 8
      fontSize: 18
      fontColor: '#202020'
    label: 否
    waypoints:
      - x: 462
        'y': 410
      - x: 462
        'y': 174
    labelOffset:
      x: 24
      'y': 0
    labelPosition: start
