      exitY: 1
      entryX: 0.5
      entryY: 0
      fontSize: 20
      fontColor: '#202020'
  - from: time
    to: results
    type: primary
    style:
      strokeColor: '#202020'
      strokeWidth: 2
      dashed: false
      endArrow: open
      endFill: false
      endSize: 8
      exitX: 0.5
      exitY: 1
      entryX: 0.5
      entryY: 0
      fontSize: 20
      fontColor: '#202020'
  - from: results
    to: tests
    type: primary
    style:
      strokeColor: '#202020'
      strokeWidth: 2
      dashed: false
