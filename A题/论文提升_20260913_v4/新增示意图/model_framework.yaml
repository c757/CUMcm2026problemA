meta:
  profile: academic-paper
  figureType: workflow
  theme: academic
  palette: ieee-bw
  layout: horizontal
  canvas: 800x248
  font:
    primary: 'Times New Roman, Noto Serif CJK SC'
    cjk: 'Times New Roman, SimSun, Noto Serif CJK SC'
    formula: 'Latin Modern, Times New Roman, Noto Serif CJK SC'
  print: {target: cn-thesis}
  title: 模型总体框架
  description: 四问采用共同热湿模型与数值框架，输入、求解、输出及检验形成闭环。
nodes:
  - id: data
    label: "附件数据\n环境与半径"
    type: process
    style: {fillColor: "#FAFAFA", fontColor: "#171717", strokeColor: "#454545", strokeWidth: 1.5}
    bounds: {x: 20, y: 20, width: 160, height: 66}
  - id: interp
    label: "参数插值\n统一单位"
    type: process
    style: {fillColor: "#FAFAFA", fontColor: "#171717", strokeColor: "#454545", strokeWidth: 1.5}
    bounds: {x: 220, y: 20, width: 160, height: 66}
  - id: model
    label: "热湿耦合模型\n物性与表面交换"
    type: process
    style: {fillColor: "#FAFAFA", fontColor: "#171717", strokeColor: "#454545", strokeWidth: 1.5}
    bounds: {x: 420, y: 20, width: 160, height: 66}
  - id: space
    label: "守恒有限体积\n径向空间离散"
    type: process
    style: {fillColor: "#FAFAFA", fontColor: "#171717", strokeColor: "#454545", strokeWidth: 1.5}
    bounds: {x: 620, y: 20, width: 160, height: 66}
  - id: time
    label: "隐式BDF积分\n状态与事件"
    type: process
    style: {fillColor: "#FAFAFA", fontColor: "#171717", strokeColor: "#454545", strokeWidth: 1.5}
    bounds: {x: 620, y: 152, width: 160, height: 66}
  - id: results
    label: "四问结果\n温湿场与烘干时间"
    type: process
    style: {fillColor: "#FAFAFA", fontColor: "#171717", strokeColor: "#454545", strokeWidth: 1.5}
    bounds: {x: 420, y: 152, width: 160, height: 66}
  - id: tests
    label: "模型检验\n守恒、解析与加密"
    type: process
    style: {fillColor: "#FAFAFA", fontColor: "#171717", strokeColor: "#454545", strokeWidth: 1.5}
    bounds: {x: 220, y: 152, width: 160, height: 66}
edges:
  - {from: data, to: interp, type: primary}
  - {from: interp, to: model, type: primary}
  - {from: model, to: space, type: primary}
  - {from: space, to: time, type: primary}
  - {from: time, to: results, type: primary}
  - {from: results, to: tests, type: primary}
